<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <title>Agent HUD: live subagent band above the Claude Code prompt</title>
  <style>
    .cap { font-size: 13px; fill: #8a8984; }
    .goal { font-size: 15px; fill: #ecebe6; }
    .goalB { font-size: 15px; fill: #ffffff; font-weight: 600; }
    .sub { font-size: 13px; fill: #8a8984; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #6f6e69; }
    .time { font-size: 14px; fill: #8a8984; font-variant-numeric: tabular-nums; }
    .run { fill: #d97757; }
    .ok { fill: #6cc28a; }
    .err { fill: #e26d6d; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
  </style>
  <rect width="880" height="440" rx="18" fill="#1a1a19"/>
  <rect x="20" y="20" width="840" height="320" rx="12" fill="#232322" stroke="#33332f"/>

  <text x="40" y="50" class="cap">Agents · 2 running · 1 done · 1 failed</text>
  <text x="740" y="50" class="cap">plan 3/7</text>

  <circle cx="46" cy="83" r="5" class="run pulse"/>
  <text x="62" y="88" class="goalB">Mac: compact tool blocks  ▾</text>
  <text x="790" y="88" class="time">1:42</text>
  <text x="62" y="108" class="sub">editing ChatView.swift · 14 steps · opus</text>
  <text x="62" y="128" class="mono">1:20  reading ChatView.swift</text>
  <text x="62" y="145" class="mono">1:31  searching “ToolBlock”</text>
  <text x="62" y="162" class="mono">1:38  editing ChatView.swift</text>

  <circle cx="46" cy="195" r="5" class="run pulse"/>
  <text x="62" y="200" class="goalB">Windows: compact tool blocks  ▸</text>
  <text x="790" y="200" class="time">1:37</text>
  <text x="62" y="220" class="sub">Build the desktop app · 9 steps · opus</text>

  <text x="40" y="256" class="ok" font-size="15">✓</text>
  <text x="62" y="256" class="goal">Compare our app with Codex and Claude  ▸</text>
  <text x="790" y="256" class="time">4:05</text>
  <text x="62" y="276" class="sub">done · 23 steps</text>

  <text x="42" y="300" class="err" font-size="15" font-weight="700">!</text>
  <text x="62" y="300" class="goal">Move secrets to protected file  ▸</text>
  <text x="62" y="320" class="sub" fill="#e26d6d" style="fill:#e26d6d">failed: API error · building the app</text>
  <text x="790" y="300" class="time">0:58</text>

  <rect x="20" y="360" width="840" height="56" rx="12" fill="#232322" stroke="#3d3d39"/>
  <text x="44" y="394" font-size="15" fill="#6f6e69">Reply to Claude…</text>
</svg>
